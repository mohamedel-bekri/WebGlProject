<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202321" />
    <title>fpsGameProject</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="game">
      <canvas id="game-canvas" aria-label="First-person 3D arena"></canvas>

      <section id="hud" class="hud hidden" aria-label="Game status">
        <div class="crosshair" aria-hidden="true"></div>
        <div class="status health">HP: 100</div>
        <div class="status ammo" id="ammo">Ammo: 30 / 30</div>
      </section>

      <section id="start-screen" class="screen">
        <div class="panel">
          <h1>fpsGameProject</h1>
          <p class="description">A small first-person arena prototype.</p>
          <button id="start-button" type="button">Start game</button>
        </div>
      </section>

            <section id="pause-screen" class="screen hidden">
        <div class="panel">
          <h2>Paused</h2>
          <button id="resume-button" type="button">Resume</button>
          <button id="settings-button" class="secondary-button" type="button">Settings</button>
          <button id="restart-button" class="secondary-button" type="button">Restart</button>
        </div>
      </section>

      <section id="settings-screen" class="screen hidden">
        <div class="panel">
          <h2>Settings</h2>
          <p class="description">Graphics quality</p>
          <div class="quality-options">
            <button class="secondary-button" type="button" data-quality="low">Low</button>
            <button class="secondary-button" type="button" data-quality="medium">Medium</button>
            <button class="secondary-button" type="button" data-quality="high">High</button>
          </div>
          <button id="settings-back-button" class="secondary-button" type="button">Back</button>
        </div>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
